# サーバーブロック - Webサーバーの設定を定義
server {
  # ポート80（HTTP）でリクエストを待ち受ける
  listen 80;

  # サーバー名（ドメイン名）を指定
  server_name localhost;

  # ドキュメントルート（Webファイルの配置場所）
  root /var/www/public;

  # インデックスファイルの優先順位を指定（左から順に探す）
  index index.php index.html;

  # すべてのIPアドレスからのアクセスを許可
  allow all;

  # アップロード可能なファイルサイズの上限（10GB）
  client_max_body_size 10000M;

  # アクセスログの出力先
  access_log /var/log/nginx/ssl-access.log;

  # エラーログの出力先
  error_log /var/log/nginx/ssl-error.log;

  # ルートパス（/）へのリクエスト処理
  location / {
    # このロケーションのドキュメントルート
    root /var/www/public;

    # ファイルが見つからない場合はindex.phpにリダイレクト（Laravel等のルーティング用）
    try_files $uri $uri/ /index.php$is_args$args;
  }

  # .phpで終わるファイルへのリクエスト処理（正規表現マッチ）
  location ~ \.php$ {
    # 存在しないPHPファイルへのアクセスは404を返す
    try_files $uri =404;

    #502

    # PHPファイルのパスとパス情報を分割する正規表現
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    # PHP-FPMへのリクエスト転送先（webコンテナの9000番ポート）
    fastcgi_pass web:9000;

    # デフォルトのインデックスファイル
    fastcgi_index index.php;

    # FastCGIの基本パラメータを読み込む
    include fastcgi_params;

    # 実行するPHPスクリプトのフルパスを指定
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    # パス情報をPHPに渡す
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # CORS（Cross-Origin Resource Sharing）設定
    # すべてのオリジンからのアクセスを許可
    add_header Access-Control-Allow-Origin *;

    # 許可するHTTPメソッド
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";

    # 許可するリクエストヘッダー
    add_header Access-Control-Allow-Headers "Origin, Authorization, Accept";

    # 認証情報（Cookie等）の送信を許可
    add_header Access-Control-Allow-Credentials true;
  }
}


